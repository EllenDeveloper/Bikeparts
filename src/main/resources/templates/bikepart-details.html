<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${bikepart.name} + ' – ' + ${bikepart.brand} + ' (' + ${bikepart.type} + ')'">Fahrradteil-Details</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div style="display: flex; justify-content: space-between; align-items: center;">
    <h1 th:text="${bikepart.name} + ' – ' + ${bikepart.brand} + ' (' + ${bikepart.type} + ')'">Fahrradteil-Details</h1>
    <div th:replace="fragments/header :: header"></div>
</div>
<p>
    <a th:href="@{/bikes/{bikeId}/bikeparts(bikeId=${bikepart.bike.id})}">← Zurück zur Teileliste</a>
</p>

<table>
    <tbody>
        <tr>
            <th>ID</th>
            <td th:text="${bikepart.id}"></td>
        </tr>
        <tr>
            <th>Bike-ID</th>
            <td th:text="${bikepart.bike.id}"></td>
        </tr>
        <tr>
            <th>Name</th>
            <td th:text="${bikepart.name}"></td>
        </tr>
        <tr>
            <th>Typ</th>
            <td th:text="${bikepart.type}"></td>
        </tr>
        <tr>
            <th>Marke</th>
            <td th:text="${bikepart.brand} ?: '–'"></td>
        </tr>
        <tr>
            <th>Modell</th>
            <td th:text="${bikepart.model} ?: '–'"></td>
        </tr>
        <tr>
            <th>Qualität</th>
            <td th:text="${bikepart.quality} ?: '–'"></td>
        </tr>
        <tr>
            <th>Alternative Qualitäten</th>
            <td th:text="${bikepart.alternativeQualities} ?: '–'"></td>
        </tr>
        <tr>
            <th>Details</th>
            <td th:text="${bikepart.specificDetails} ?: '–'"></td>
        </tr>
        <tr>
            <th>Reifenbreite</th>
            <td th:text="${bikepart.tireWidth} ?: '–'"></td>
        </tr>
        <tr>
            <th>Letzter Kaufpreis</th>
            <td th:text="${bikepart.lastPurchasePrice != null} ? ${#numbers.formatDecimal(bikepart.lastPurchasePrice, 1, 2)} + ' €' : '–'"></td>
        </tr>
        <tr>
            <th>Letztes Kaufdatum</th>
            <td th:text="${bikepart.lastPurchaseDate != null} ? ${#temporals.format(bikepart.lastPurchaseDate, 'dd.MM.yyyy')} : '–'"></td>
        </tr>
        <tr>
            <th>Letzter Shop</th>
            <td th:text="${bikepart.lastPurchaseShop} ?: '–'"></td>
        </tr>
        <tr>
            <th>Einbaudatum</th>
            <td th:text="${bikepart.installationDate != null} ? ${#temporals.format(bikepart.installationDate, 'dd.MM.yyyy')} : '–'"></td>
        </tr>
        <tr>
            <th>Notizen</th>
            <td th:text="${bikepart.notes} ?: '–'"></td>
        </tr>
        <tr>
            <th>Erstellt am</th>
            <td th:text="${#temporals.format(bikepart.createdAt, 'dd.MM.yyyy HH:mm')} + ' Uhr'"></td>
        </tr>
        <tr>
            <th>Aktualisiert am</th>
            <td th:text="${#temporals.format(bikepart.updatedAt, 'dd.MM.yyyy HH:mm')} + ' Uhr'"></td>
        </tr>
        <tr>
            <th>In den Warenkorb</th>
            <td class="cart-cell">
                <form th:action="@{/bikeparts/{id}/addBikepartToCart(id=${bikepart.id})}" method="post">
                    <input type="number" id="quantity" name="quantity" value="1" min="1" />
                    <button type="submit" class="cart-btn">
                        <i class="fa-solid fa-cart-shopping cart-default"></i>
                        <i class="fa-solid fa-cart-arrow-down cart-hover"></i>
                    </button>
                </form>
            </td>
        </tr>
    </tbody>
</table>

</body>
<div th:replace="fragments/footer :: footer"></div>
</html>
