<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
    <meta charset="UTF-8">
    <title>Bike-Liste</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div style="display: flex; justify-content: space-between; align-items: center;">
    <h1>Verwaltete Fahrräder</h1>
    <a th:href="@{/cart/{id}(id=${accountId})}" title="Warenkorb">
        <i class="fa-solid fa-cart-shopping" style="font-size: 1.8rem;"></i>
    </a>
</div>

<p>Anzahl Fahrräder: <span th:text="${bikes.size()}">0</span></p>

<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Typ</th>
            <th>E-Bike</th>
            <th>Marke</th>
            <th>Modell</th>
            <th>Rahmengröße</th>
            <th>Notizen</th>
            <th>Verschleißteile</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="bike : ${bikes}"
            th:onclick="|window.location='@{/bikes/{bikeId}(bikeId=${bike.id})}'|"
            style="cursor: pointer;">
            <td th:text="${bike.id}"></td>
            <td th:text="${bike.name}"></td>
            <td th:text="${bike.type}"></td>
            <td th:text="${bike.isEbike} ? 'Ja' : 'Nein'"></td>
            <td th:text="${bike.brand}"></td>
            <td th:text="${bike.modelName}"></td>
            <td th:text="${bike.wheelSize} + ' Zoll'"></td>
            <td th:text="${bike.notes}"></td>
            <td><a th:href="@{/bikes/{bikeId}/bikeparts(bikeId=${bike.id})}">Teile anzeigen</a></td>
        </tr>
    </tbody>
</table>
</body>
</html>
