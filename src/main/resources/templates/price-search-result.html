<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
    <meta charset="UTF-8">
    <title>Preissuche - Ergebnisse</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div style="display: flex; justify-content: space-between; align-items: center;">
    <h1>
        <i class="fa-solid fa-magnifying-glass-dollar" style="font-size: 1.8rem; color: #5659fb;"></i>
        Preissuche: <span th:text="${bikepartName}">Fahrradteil</span>
    </h1>
    <div th:replace="~{fragments/header :: header}"></div>
</div>

<p style="margin-bottom: 1.5rem;">
    <a th:href="@{/cart}"><i class="fa-solid fa-arrow-left"></i> Zurück zum Warenkorb</a>
</p>

<!-- Keine Ergebnisse überhaupt -->
<div th:if="${scrapingResults == null or scrapingResults.isEmpty()}"
     class="alert alert-error fade-in">
    <strong><i class="fa-solid fa-circle-exclamation"></i> Keine Daten verfügbar</strong>
    <p style="margin-top: 0.5rem; margin-bottom: 0;">
        Es konnten keine Shops abgefragt werden.
    </p>
</div>

<!-- Gemeinsame Tabelle aller Shops -->
<table th:if="${scrapingResults != null and !scrapingResults.isEmpty()}">
    <thead>
        <tr>
            <th>Produkt</th>
            <th>Preis</th>
            <th>Verfügbar</th>
            <th>Abgerufen am</th>
            <th>Link</th>
        </tr>
    </thead>
    <tbody>

        <th:block th:each="scrapingResult : ${scrapingResults}">

            <!-- Shop-Trennzeile (blau, fett) -->
            <tr class="shop-header-row">
                <td colspan="5">
                    <i class="fa-solid fa-shop"></i>
                    <span th:text="${scrapingResult.shopName()}"></span>

                    <span th:if="${scrapingResult.status().name() == 'SUCCESS'}"
                          class="shop-status-badge shop-status-success">
                        <i class="fa-solid fa-check"></i>
                        <span th:text="${scrapingResult.offers().size()}"></span> Angebote
                    </span>
                    <span th:if="${scrapingResult.status().name() == 'NO_RESULTS'}"
                          class="shop-status-badge shop-status-warning">
                        <i class="fa-solid fa-circle-info"></i> Keine Treffer
                    </span>
                    <span th:if="${scrapingResult.status().name() == 'ERROR'}"
                          class="shop-status-badge shop-status-error">
                        <i class="fa-solid fa-circle-exclamation"></i> Fehler
                    </span>
                </td>
            </tr>

            <!-- Fehlerzeile -->
            <tr th:if="${scrapingResult.status().name() == 'ERROR'}" class="row-error">
                <td colspan="5">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    Shop nicht erreichbar:
                    <span th:text="${scrapingResult.errorMessage() != null
                                     ? scrapingResult.errorMessage()
                                     : 'Unbekannter Fehler'}">
                    </span>
                </td>
            </tr>

            <!-- Keine-Treffer-Zeile -->
            <tr th:if="${scrapingResult.status().name() == 'NO_RESULTS'}" class="row-no-results">
                <td colspan="5">
                    <i class="fa-solid fa-circle-info"></i>
                    Keine passenden Angebote für diese Suchanfrage.
                </td>
            </tr>

            <!-- Angebot-Zeilen -->
            <tr th:each="offer : ${scrapingResult.offers()}">
                <td th:text="${offer.productName}"></td>
                <td th:text="${offer.price != null
                               ? #numbers.formatDecimal(offer.price, 1, 2) + ' €'
                               : '-'}">
                </td>
                <td>
                    <span th:if="${offer.inStock}"  class="badge-available">verfügbar</span>
                    <span th:if="${!offer.inStock}" class="badge-unavailable">nicht verfügbar</span>
                </td>
                <td th:text="${#temporals.format(offer.fetchedAt, 'dd.MM.yyyy HH:mm')}"></td>
                <td onclick="event.stopPropagation()">
                    <a th:href="${offer.productUrl}" target="_blank">
                        <i class="fa-solid fa-arrow-up-right-from-square"></i> Zum Shop
                    </a>
                </td>
            </tr>

        </th:block>

    </tbody>
</table>

</body>
<div th:replace="~{fragments/footer :: footer}"></div>
</html>
