<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
    <meta charset="UTF-8">
    <title th:text="${bike.name} + ' – ' + ${bike.brand} + ' (' + ${bike.type} + ')'">Fahrrad-Details</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div style="display: flex; justify-content: space-between; align-items: center;">
    <h1 th:text="${bike.name} + ' – ' + ${bike.brand} + ' (' + ${bike.type} + ')'">Fahrrad-Details</h1>
    <!-- Header-Fragment einfügen -->
    <div th:replace="fragments/header :: header"></div>
</div>
<p>
    <a th:href="@{/accounts/{id}/bikes(id=${bike.account.id})}">← Zurück zur Fahrradliste</a>
</p>

<table>
    <tbody>
        <tr>
            <th>ID</th>
            <td th:text="${bike.id}"></td>
        </tr>
        <tr>
            <th>Account-ID</th>
            <td th:text="${bike.account.id}"></td>
        </tr>
        <tr>
            <th>Name</th>
            <td th:text="${bike.name}"></td>
        </tr>
        <tr>
            <th>Typ</th>
            <td th:text="${bike.type}"></td>
        </tr>
        <tr>
            <th>E-Bike</th>
            <td th:text="${bike.isEbike} ? 'Ja' : 'Nein'"></td>
        </tr>
        <tr>
            <th>Marke</th>
            <td th:text="${bike.brand} ?: '–'"></td>
        </tr>
        <tr>
            <th>Modellname</th>
            <td th:text="${bike.modelName} ?: '–'"></td>
        </tr>
        <tr>
            <th>Radgröße</th>
            <td th:text="${bike.wheelSize != null} ? ${bike.wheelSize} + ' Zoll' : '–'"></td>
        </tr>
        <tr>
            <th>Kaufdatum</th>
            <td th:text="${bike.purchaseDate != null} ? ${#temporals.format(bike.purchaseDate, 'dd.MM.yyyy')} : '–'"></td>
        </tr>
        <tr>
            <th>Kaufpreis</th>
            <td th:text="${bike.purchasePrice != null} ? ${#numbers.formatDecimal(bike.purchasePrice, 1, 2)} + ' €' : '–'"></td>
        </tr>
        <tr>
            <th>Notizen</th>
            <td th:text="${bike.notes} ?: '–'"></td>
        </tr>
        <tr>
            <th>Erstellt am</th>
            <td th:text="${#temporals.format(bike.createdAt, 'dd.MM.yyyy HH:mm')} + ' Uhr'"></td>
        </tr>
        <tr>
            <th>Aktualisiert am</th>
            <td th:text="${#temporals.format(bike.updatedAt, 'dd.MM.yyyy HH:mm')} + ' Uhr'"></td>
        </tr>
    </tbody>
</table>

<p>
    <a th:href="@{/bikes/{bikeId}/bikeparts(bikeId=${bike.id})}">Verschleißteile anzeigen</a>
</p>

</body>
<div th:replace="fragments/footer :: footer"></div>
</html>
